spring.application.name=Schedule_Planner
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/schedule_planner}
spring.datasource.username=${DB_USERNAME:schedule_planner}
spring.datasource.password=${DB_PASSWORD:schedule_planner}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.security.jwt.secret=${JWT_SECRET:change-this-jwt-secret-for-local-development-only}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
