services:
  - type: web
    name: schedule-planner-backend
    env: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter backend prisma:generate && pnpm --filter backend build
    startCommand: node backend/dist/src/main.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FIRST_NAME
        sync: false
      - key: ADMIN_LAST_NAME
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        value: https://schedule-planner-frontend.onrender.com

  - type: web
    name: schedule-planner-frontend
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter frontend build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://schedule-planner-backend-mf38.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
